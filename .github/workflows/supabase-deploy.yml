name: Deploy Supabase backend

# Deploys the `swing` edge function and keeps the pg_cron schedules in sync.
#
# One-time setup — add two repository secrets
# (Settings → Secrets and variables → Actions → New repository secret):
#
#   SUPABASE_ACCESS_TOKEN   from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_URL         Settings → Database → Connection string → URI
#                           (optional; only needed to schedule pg_cron)
#
# After that this runs automatically whenever the function or the cron SQL
# changes, and can be run by hand from the Actions tab. Secrets are masked
# in the logs by GitHub and nothing secret is committed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/cron.sql"
      - ".github/workflows/supabase-deploy.yml"

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: mskymzputorcvqehjugq
      # secrets.* cannot be used in a step-level `if:`, so surface it here —
      # job-level env may reference secrets and `env` is allowed in `if`.
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is configured
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it under"
            echo "::error::Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "token present"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy the swing edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # --no-verify-jwt: the function authenticates callers itself
          # (owner JWT for app actions, x-ingest-secret for cron).
          supabase functions deploy swing \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Confirm it is live and refuses anonymous calls
        run: |
          code="$(curl -s -o /tmp/body.txt -w '%{http_code}' -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/swing" \
            -H 'Content-Type: application/json' \
            -d '{"action":"nightly"}' || true)"
          echo "unauthenticated POST -> HTTP $code"
          head -c 300 /tmp/body.txt || true
          echo
          if [ "$code" != "401" ]; then
            echo "::warning::expected 401 from an unauthenticated call, got $code"
          fi

      - name: Install psql
        if: env.DB_URL != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Schedule the pg_cron jobs
        if: env.DB_URL != ''
        env:
          PGURL: ${{ env.DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/cron.sql
          echo "--- scheduled jobs ---"
          psql "$PGURL" -qtAX -c \
            "select jobname || '  |  ' || schedule || '  |  active=' || active
             from cron.job order by jobname;"

      - name: Report database state
        if: env.DB_URL != ''
        env:
          PGURL: ${{ env.DB_URL }}
        run: |
          echo "--- RLS per table (every one must be true) ---"
          psql "$PGURL" -qtAX -c \
            "select tablename || '=' || rowsecurity from pg_tables
             where schemaname='public' order by tablename;"
          echo "--- anon grants on public tables (must be empty) ---"
          psql "$PGURL" -qtAX -c \
            "select table_name || ':' || privilege_type
             from information_schema.role_table_grants
             where grantee='anon' and table_schema='public';"
          echo "--- server_secrets keys (names only, never values) ---"
          psql "$PGURL" -qtAX -c "select key from public.server_secrets order by key;"
          echo "--- row counts ---"
          psql "$PGURL" -qtAX -c \
            "select 'stocks='||(select count(*) from public.stocks)
                 ||' candles='||(select count(*) from public.candles)
                 ||' levels='||(select count(*) from public.levels)
                 ||' screener_runs='||(select count(*) from public.screener_runs);"

      - name: Kite smoke test through the deployed function
        if: env.DB_URL != ''
        env:
          PGURL: ${{ env.DB_URL }}
        run: |
          SECRET="$(psql "$PGURL" -qtAX -c \
            "select value->>'value' from public.server_secrets where key='ingest_secret';")"
          echo "::add-mask::$SECRET"
          echo "sync_instruments — proves the stored Kite credentials work:"
          curl -s -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/swing" \
            -H 'Content-Type: application/json' \
            -H "x-ingest-secret: $SECRET" \
            -d '{"action":"sync_instruments"}' | head -c 600
          echo
          echo "(a Kite token error here means the daily token needs refreshing in Settings —"
          echo " the function itself is deployed and reachable)"
